# ================= SERVER =================
server.port=8080

# ================= POSTGRESQL =================
# Change the password here, or set the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/passport_automation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================= JPA / HIBERNATE =================
# "update" creates/updates tables automatically (database/schema.sql is the manual equivalent)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ================= JWT =================
# Secret must be at least 32 characters. Override with JWT_SECRET in real deployments.
app.jwt.secret=${JWT_SECRET:passport-automation-demo-secret-key-change-me-0123456789}
app.jwt.expiration-ms=86400000

# ================= CORS =================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ================= DEFAULT STATUS CHANGER (seeded on first start) =================
app.seed.status-changer.name=${SEED_NAME:Status Changer}
app.seed.status-changer.email=${SEED_EMAIL:statuschanger@passport.com}
app.seed.status-changer.password=${SEED_PASSWORD:ChangeMe123}

# ================= EMAIL (Spring Boot Mail) =================
# Gmail example: enable 2-step verification and create an "App password".
# If MAIL_USERNAME is empty, emails are NOT sent - they are printed in the console log instead.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@passport-automation.local}
